<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GearTrack - Equipment Loans</title>
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/components.css">
    </head>
    <body>
        <header class="app-header">
            <h1>GearTrack Department Manager</h1>
        </header>
        <main class="dashboard">
            <section class="panel">
                <h2>Available Equipment</h2>
                <!-- Label describing the category filter. -->
                <label for="category-filter">Filter by category</label>
                <!-- Dropdown used to filter equipment by category. -->
                <select id="category-filter">
                    <option value="all">All categories</option>
                </select>
                <ul id="equipment-list" class="item-list"></ul>
            </section>
            <section class="panel">
                <h2>Active Loans</h2>
                <div id="active-loans-list" class="item-list"></div>
            </section>
            <!-- Checkout form modal -->
            <dialog id="checkout-dialog">
                <h2>Checkout Equipment</h2>
                <form id="checkout-form">
                    <label for="borrower-name">Borrower Name</label>
                    <input type="text" id="borrower-name" required>

                    <label for="borrower-email">Borrower Email</label>
                    <input type="email" id="borrower-email" required>

                    <label for="return-date">Return Date</label>
                    <input type="date" id="return-date" required>
                    
                    <button type="button" id="cancel-checkout">Cancel</button>
                    <button type="submit">Confirm Checkout</button>
                </form>
            </dialog>
        </main>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
